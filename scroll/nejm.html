<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Newsroom Demo</title>
</head>
<body>
  <!-- Reuses index.html's markup; only the client config differs. -->
  <script>
    (async function () {
      const html = await (await fetch("index.html")).text();
      const doc = new DOMParser().parseFromString(html, "text/html");

      document.title = doc.title;
      doc.head.querySelectorAll("link").forEach((el) => {
        document.head.appendChild(document.importNode(el, true));
      });
      Array.from(doc.body.children).forEach((el) => {
        if (el.tagName !== "SCRIPT") document.body.appendChild(document.importNode(el, true));
      });

      // Scripts must run in order, after the markup exists.
      for (const src of ["clients/nejm.js", "js/main.js"]) {
        await new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
      }
    })();
  </script>
</body>
</html>
